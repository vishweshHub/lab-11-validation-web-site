<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Login - Validation System</title>
  <link rel="stylesheet" href="/public/css/style.css">
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="header">
        <div class="logo-icon icon-login">🔐</div>
        <h1>User Validation</h1>
        <p>Enter your credentials to verify with Database</p>
      </div>

      {{ALERT_HTML}}

      <form action="/login" method="POST">
        <div class="form-group">
          <label for="username">Login Name / Username</label>
          <input 
            type="text" 
            id="username" 
            name="username" 
            placeholder="e.g. admin or john_doe" 
            value="{{PREFILL_USERNAME}}"
            required 
            autofocus
          >
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input 
            type="password" 
            id="password" 
            name="password" 
            placeholder="Enter your password" 
            required
          >
        </div>

        <button type="submit" class="btn btn-primary">Log In</button>
      </form>

      <div class="reference-box">
        <div class="reference-title">
          <span>📋</span> Pre-seeded Database Credentials
        </div>
        <table class="reference-table">
          <thead>
            <tr>
              <th>Username</th>
              <th>Password</th>
              <th>Role</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td><strong>admin</strong></td>
              <td>admin123</td>
              <td>Administrator</td>
            </tr>
            <tr>
              <td><strong>john_doe</strong></td>
              <td>password123</td>
              <td>Student</td>
            </tr>
            <tr>
              <td><strong>alice</strong></td>
              <td>securePass2024</td>
              <td>Instructor</td>
            </tr>
          </tbody>
        </table>
      </div>

      <div class="footer-nav">
        Don't have an account in the database? <a href="/register">Register here</a>
      </div>
    </div>
  </div>
</body>
</html>
